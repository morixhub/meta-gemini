#@TYPE: Machine
#@NAME: AESYS 2409A board (NXP i.MX 8M Nano with LPDDR4 with LPDDR4)
#@SOC: i.MX8M Nano
#@DESCRIPTION: Machine configuration for AESYS 2409A board
#@MAINTAINER: morix.dev <morix.dev@gmail.com>

require conf/machine/include/imx8mn-evk.inc

# The device tree name is implicit for LPDDR4, so can't use MACHINE here
KERNEL_DEVICETREE_BASENAME = "aesys_2409a"
KERNEL_DEVICETREE:append = " \
    freescale/${KERNEL_DEVICETREE_BASENAME}_m7.dtb \
"

# Remove additional DTBs, inherited from the included file
KERNEL_DEVICETREE:remove:use-nxp-bsp = " \
    freescale/${KERNEL_DEVICETREE_BASENAME}-ak5558.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-lk.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-rm67191.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-rm67191-cmd-ram.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-rm67199.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-rm67199-cmd-ram.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-rpmsg.dtb \
"

UBOOT_CONFIG_BASENAME = "aesys_2409a"
DDR_FIRMWARE_NAME = " \
    lpddr4_pmu_train_1d_dmem.bin \
    lpddr4_pmu_train_1d_imem.bin \
    lpddr4_pmu_train_2d_dmem.bin \
    lpddr4_pmu_train_2d_imem.bin \
"

IMXBOOT_TARGETS_BASENAME = "flash_evk"

# Mainline BSP doesn't support LPDDR4 so it must be set to nxp.
# Also this machine isn't supported by u-boot-fslc but imx8mn-evk.inc already
# set the bootloader to u-boot-imx instead when NXP BSP is used.
IMX_DEFAULT_BSP = "nxp"

# Need to remove all extra args from WIC command, otherwise
# base recipes will include the default option for not touching fstab
# which we do not want in this case
WIC_CREATE_EXTRA_ARGS = ""

# Set initial ramdisk image
INITRAMFS_IMAGE = "aesys-initramfs-image"

# Since we want to insert into WIC an artifact (squashfs of the root filesystem)
# built by a task that do_image_wic does not depend on, then we need to
# add an extra dependency
do_image_wic[recrdeptask] += "do_image_squashfs"

# Specify custom disk partitioning
WKS_FILE = "aesys.wks.in"
WKS_FILE_DEPENDS:append = " \
    squashfs-tools-native \
    ${INITRAMFS_IMAGE} \
"

# Include the initial ramdisk image in the boot partition
IMAGE_BOOT_FILES:append = " \
    initramfs.cpio.gz.u-boot;initram.img \
    ${IMGDEPLOYDIR}/${IMAGE_NAME}.squashfs;rootfs.squashfs \
"

