# Aesys DISTRO based on fsl-imx-wayland
BASE_DISTRO="conf/distro/fsl-imx-wayland.conf"
BASE_DISTRO:genericx86-64="conf/distro/poky.conf"

require ${BASE_DISTRO} 

DISTRO = "aesys-distro"
DISTRO_NAME = "Aesys Linux"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "aesys-distro"

# Set preferred recipes version for this distro
PREFERRED_VERSION_neatvnc = "0.6.0%"

# Tweak distro features on x86/x64 for mimicking fsl-imx-wayland distro
DISTRO_FEATURES:genericx86-64:remove = "directfb x11 sysvinit"
DISTRO_FEATURES:genericx86-64:append = " systemd pam wayland usrmerge ipv6 opengl "
DISTRO_FEATURES_BACKFILL_CONSIDERED:genericx86-64:append = "sysvinit"
PREFERRED_VERSION_neatvnc:genericx86-64 = "0.7%"

VIRTUAL-RUNTIME_init_manager:genericx86-64 = "systemd"
VIRTUAL-RUNTIME_initscripts:genericx86-64 = "systemd-compat-units"

# Add pulseaudio
DISTRO_FEATURES:append = "dbus pulseaudio"

# Remove nfs from DISTRO_FEATURES (since it implies rpcbind which we could get rid of due to OS harderning)
DISTRO_FEATURES:remove = "nfs"

# Remote ptest from DISTRO_FEATURES (for minimizing the size of produced images)
DISTRO_FEATURES:remove = "ptest"

# Force rsyslog as syslog manager, for OS hardening purposes
# (the default is sysklog but it seems quite an outdated project)
VIRTUAL-RUNTIME_syslog = "rsyslog"